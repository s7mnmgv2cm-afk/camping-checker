name: 自動露營區爬蟲機器人

on:
  schedule:
    - cron: '0 * * * *' # 每小時自動執行一次
  workflow_dispatch: # 允許在網頁手動按按鈕執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 機器人開始執行
        run: |
          echo "機器人已醒來，正在檢查各大露營區空位..."
